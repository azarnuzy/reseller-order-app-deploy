name: Publish and deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: reseller-app-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/azarnuzy/reseller-order-app-agent

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check lint rules
        run: pnpm lint

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Build applications
        run: pnpm build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: api
          - target: platform
            image: platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_URL=https://api.reseller.azarnuzy.com
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'ubuntu' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      REMOTE_APP_DIRECTORY: /srv/apps/reseller-app
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Verify images are publicly readable
        run: |
          docker buildx imagetools inspect "${IMAGE_PREFIX}-api:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE_PREFIX}-platform:${GITHUB_SHA}"

      - name: Configure SSH
        run: |
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

      - name: Upload release configuration
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "test -f '${REMOTE_APP_DIRECTORY}/env.production'"
          scp -P "${VPS_PORT}" \
            deploy/compose.prod.yaml \
            deploy/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_APP_DIRECTORY}/"

      - name: Deploy release
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${REMOTE_APP_DIRECTORY}' && chmod 700 deploy.sh && ./deploy.sh '${GITHUB_SHA}'"
